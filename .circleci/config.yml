version: 2
jobs:
  csharp_test:
    working_directory: /usr/local/src/sawan
    docker:
      - image: mcr.microsoft.com/dotnet/core/sdk:latest
    steps:
      - checkout
      - run:
          name: restore
          command: dotnet restore
      - run:
          name: build
          command: dotnet test /p:AltCover=true /p:AltCoverAssemblyFilter="xunit|sawan.Views" /p:AltCoverFileFilter="Program.cs|Startup.cs"
  publish:
    working_directory: /usr/local/src/sawan/sawan
    docker:
      - image: mcr.microsoft.com/dotnet/core/sdk:latest
    steps:
      - checkout
      - run:
          name: publish
          command: dotnet publish --output=/usr/local/src/sawan/publish
  typescript:
    working_directory: /usr/local/src/sawan/ClientApp
    docker:
      - image: circleci/node:11.15.0
    steps:
      - checkout
      - run:
          name: restore
          command: yarn install --silent --no-progress
      - run:
          name: build
          command: yarn build --silent --no-progress
  typescript_test:
    working_directory: /usr/local/src/sawan/ClientApp
    docker:
      - image: circleci/node:11.15.0
    steps:
      - checkout
      - run:
          name: test
          command: yarn --silent run test:coverage
workflows:
  version: 2
  do_it_all:
    jobs:
      - typescript_test
      - csharp_test
      - typescript
      - publish:
          requires:
            - typescript
          filters:
            branches:
              only: master
